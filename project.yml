name: KnightMusic
options:
  bundleIdPrefix: com.knightabdo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"

targets:
  KnightMusic:
    type: application
    platform: iOS
    sources:
      - path: KnightMusic
      - path: KnightMusicWidgets/Shared
    dependencies:
      - target: KnightMusicWidgets
        embed: true
      - package: GRDB
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knightabdo.knightmusic
        PRODUCT_NAME: KnightMusic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KnightMusic/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: KnightMusic/Resources/KnightMusic.entitlements
    info:
      path: KnightMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Knight Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.knightabdo.knightmusic
            CFBundleURLSchemes:
              - knightmusic
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio, fetch, processing]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Knight Music connects to your Navidrome server on your local network.
        NSMicrophoneUsageDescription: Knight Music uses the microphone for dictating requests to Knight AI.
        NSSpeechRecognitionUsageDescription: Knight Music uses speech recognition to convert your voice into text for Knight AI.
        BGTaskSchedulerPermittedIdentifiers: [com.knightabdo.knightmusic.sync]

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  KnightMusicWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KnightMusicWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knightabdo.knightmusic.widgets
        PRODUCT_NAME: KnightMusicWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KnightMusicWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: KnightMusicWidgets/KnightMusicWidgets.entitlements
    info:
      path: KnightMusicWidgets/Info.plist
      properties:
        CFBundleDisplayName: Knight Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

