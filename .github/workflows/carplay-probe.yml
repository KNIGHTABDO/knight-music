# Manual probe: can a macOS runner open the Simulator's CarPlay display and screenshot it?
name: carplay-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: bash scripts/carplay-probe.sh probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
